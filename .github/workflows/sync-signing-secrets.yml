name: Sync signing secrets

# Copies the shared signing key (this repo's secrets KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD) into every non-archived repo of the owner that has a `gradlew` at its root, so
# new Android repos get the key by the next night without any manual step.
#
# Needs the secret SYNC_TOKEN: a fine-grained personal access token with access to
# "All repositories" and the repository permissions "Secrets: Read and write" and
# "Contents: Read-only" (needed to see `gradlew` in private repos).

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-signing-secrets

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Copy the shared key to every Android repo
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in GH_TOKEN KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is missing in $GITHUB_REPOSITORY (GH_TOKEN = SYNC_TOKEN)"
              exit 1
            fi
          done

          repos=$(gh api --paginate "user/repos?affiliation=owner&per_page=100" \
            --jq '.[] | select(.archived | not) | .full_name')

          synced=()
          for repo in $repos; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            gh api "repos/$repo/contents/gradlew" --silent > /dev/null 2>&1 || continue
            echo "-> $repo"
            gh secret set KEYSTORE_BASE64 -R "$repo" --body "$KEYSTORE_BASE64"
            gh secret set STORE_PASSWORD  -R "$repo" --body "$STORE_PASSWORD"
            gh secret set KEY_ALIAS       -R "$repo" --body "$KEY_ALIAS"
            gh secret set KEY_PASSWORD    -R "$repo" --body "$KEY_PASSWORD"
            synced+=("$repo")
          done

          {
            echo "## Signing secrets synced to ${#synced[@]} repos"
            for r in "${synced[@]}"; do echo "- $r"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub disables scheduled workflows of public repos after 60 days without commits;
      # re-enabling it on every run keeps the nightly sync alive.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-signing-secrets.yml/enable"
